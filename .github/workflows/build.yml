name: Build Mataiasu Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained EXE
        run: dotnet publish MataiasuLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MataiasuLauncher-Windows-x64
          path: bin/Release/net8.0-windows/win-x64/publish/MataiasuLauncher.exe
