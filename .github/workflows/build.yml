name: Build Launch'aiasu

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp build commit
        shell: pwsh
        run: |
          @"
          internal static class BuildInfo
          {
              public const string Commit = "${{ github.sha }}";
          }
          "@ | Set-Content -Path BuildInfo.cs -Encoding UTF8

      - name: Build self-contained EXE
        run: dotnet publish MataiasuLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false

      - name: Prepare update metadata
        shell: pwsh
        run: |
          Copy-Item "bin/Release/net8.0-windows/win-x64/publish/MataiasuLauncher.exe" "MataiasuLauncher.exe" -Force
          "${{ github.sha }}" | Set-Content "MataiasuLauncher.commit.txt" -Encoding UTF8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launch'aiasu-Windows-x64
          path: |
            MataiasuLauncher.exe
            MataiasuLauncher.commit.txt

      - name: Publish rolling update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Launch'aiasu - latest
          body: |
            Automatic rolling release for the latest main commit of Launch'aiasu.

            Commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            MataiasuLauncher.exe
            MataiasuLauncher.commit.txt
